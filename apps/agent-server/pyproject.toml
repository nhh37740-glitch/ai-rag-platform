[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-server"
version = "0.7.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "python-multipart", "core_specifications>=0.5.0", "agent_facade", "rag_facade", "data_facade", "auth_facade>=0.3.0", "observability"]
