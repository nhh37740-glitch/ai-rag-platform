<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>管理员登录 · Knowledge Studio</title><link rel="stylesheet" href="auth/login.css"></head>
<body><main class="login-card"><a class="brand" href="../">Knowledge Studio</a><h1>管理员知识工作区</h1><p>使用你的拥有者账号登录，即可创建笔记本、导入文档并对来源提问。</p><form id="login-form"><label>账号<input id="username" name="username" autocomplete="username" maxlength="64" required></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required></label><button id="submit" type="submit">登录工作区</button><p id="status" role="status" aria-live="polite">正在连接登录服务…</p></form><p class="hint">仅拥有者可管理私人文档。访客可使用<a href="../">公开只读演示</a>。</p></main><script src="auth/login.js" defer></script></body>
</html>
