services:
  agent:
    image: ai-rag-public:local
    labels:
      dev-knowledge.public-provider: ${PUBLIC_DEMO_PROVIDER:-deepseek}
      dev-knowledge.public-env-file: ${PUBLIC_DEMO_ENV_FILE:-/home/ubuntu/.config/ai-rag/public-demo.env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18106:8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.50
    # Credentials are injected as environment variables, never mounted as files.
    env_file:
      - ${PUBLIC_DEMO_ENV_FILE:-/home/ubuntu/.config/ai-rag/public-demo.env}
    environment:
      PUBLIC_DEMO: "1"
      DEMO_PROVIDER: ${PUBLIC_DEMO_PROVIDER:-deepseek}
      RAG_EMBED: hash
      STATE_DIR: /opt/agent/state
    volumes:
      - public-demo-state:/opt/agent/state

volumes:
  public-demo-state:
