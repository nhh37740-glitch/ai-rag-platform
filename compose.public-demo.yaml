services:
  agent:
    image: ai-rag-public:local
    labels:
      dev-knowledge.public-provider: ${PUBLIC_DEMO_PROVIDER:-openrouter}
      dev-knowledge.public-env-file: ${PUBLIC_DEMO_ENV_FILE:-/home/ubuntu/.config/ai-rag/openrouter-runtime.env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18106:8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.50
    # Runtime credentials are separate from Jenkins build credentials.
    env_file:
      - ${PUBLIC_DEMO_ENV_FILE:-/home/ubuntu/.config/ai-rag/openrouter-runtime.env}
      - ${RAG_BOOTSTRAP_ENV_FILE:-/home/ubuntu/.config/ai-rag/bootstrap-admin.env}
    environment:
      PUBLIC_DEMO: "1"
      DEMO_PROVIDER: ${PUBLIC_DEMO_PROVIDER:-openrouter}
      LLM_PROVIDER: ${PUBLIC_DEMO_PROVIDER:-openrouter}
      RAG_EMBED: hash
      STATE_DIR: /opt/agent/state
    volumes:
      - ragnotebook-public-state:/opt/agent/state

volumes:
  ragnotebook-public-state:
    name: ${PUBLIC_STATE_VOLUME_NAME:-ai-rag-public-ragnotebook-state}
