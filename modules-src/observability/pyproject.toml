[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "observability"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["core_contracts"]

[tool.setuptools]
packages = ["observability"]

