[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_facade"
version = "0.5.2"
requires-python = ">=3.11"
dependencies = ["core_specifications", "agent_runtime>=0.5.1", "llm_gateway", "tool_runtime", "skill_runtime", "observability"]

[tool.setuptools]
packages = ["agent_facade"]
