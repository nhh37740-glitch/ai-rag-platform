[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ingestion"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = ["core_specifications", "pypdf"]
scripts = { ingestion_worker = "ingestion.__main__:main" }

[tool.setuptools]
packages = ["ingestion"]
