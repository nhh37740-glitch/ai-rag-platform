[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_facade"
version = "0.3.2"
requires-python = ">=3.11"
dependencies = ["observability>=0.1.0,<1", "core_specifications", "rag_core", "rag_tools", "ingestion"]

[tool.setuptools]
packages = ["rag_facade"]
