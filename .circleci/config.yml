version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.13
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Create venv & install project
          command: |
            uv venv .venv
            uv pip install --python .venv/bin/python \
              -e contracts -e modules-src/observability -e modules-src/memory \
              -e modules-src/rag_core -e modules-src/llm_gateway -e modules-src/tool-runtime \
              -e modules-src/skill-runtime -e modules-src/agent_runtime -e modules-src/evaluation \
              -e modules-src/ingestion -e modules-src/mcp-gateway -e modules-src/mcp-servers \
              -e modules-src/storage \
              fastapi uvicorn pydantic pytest httpx numpy scikit-learn python-docx
      - run:
          name: CI gate (offline deterministic)
          command: .venv/bin/python scripts/ci.py

workflows:
  version: 2
  build:
    jobs:
      - test
