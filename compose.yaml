services:
  agent:
    image: ai-rag-platform:local
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.50
    env_file:
      - ${RAG_MODEL_ENV_FILE:-/home/ubuntu/.config/ai-rag/openrouter-runtime.env}
    labels:
      dev-knowledge.model-env-file: ${RAG_MODEL_ENV_FILE:-/home/ubuntu/.config/ai-rag/openrouter-runtime.env}
    environment:
      STATE_DIR: /opt/agent/state
      RAG_DATABASE_PATH: /opt/agent/state/ragnotebook.sqlite
      RAG_EMBED: ${RAG_EMBED:-fastembed}
      BGE_MODEL: ${BGE_MODEL:-BAAI/bge-small-zh-v1.5}
      FASTEMBED_CACHE_PATH: /opt/agent/models/fastembed_cache
    volumes:
      - agent-state:/opt/agent/state
      - model-cache:/opt/agent/models/fastembed_cache

volumes:
  agent-state:
  model-cache:
